<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' blob:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文件怪桌宠</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app" class="app-shell collapsed">
    <section id="petStage" class="pet-stage" aria-label="文件怪桌宠区域">
      <div id="petInteractive" class="pet-interactive">
        <div id="speech" class="speech">桌面躺平中…</div>
        <div class="video-wrap">
          <img id="petSprite" src="../assets/videos/filemonster_idle.webp" alt="" draggable="false" />
        </div>
      </div>
      <div id="dropHalo" class="drop-halo">丢进来，我帮你收</div>
    </section>
    <aside id="panel" class="control-panel">
      <header class="panel-header">
        <div class="brand-lockup">
          <img class="brand-pet" src="../assets/icon-app.png" alt="" draggable="false" />
          <div class="brand-copy">
            <h1>文件怪</h1>
            <p id="statusText">稳住，能赢。帮你整理，一切井井有条！</p>
          </div>
        </div>
        <div class="window-actions">
          <button id="btnMinimize" title="隐藏到托盘（双击托盘图标恢复）"><svg class="window-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"></path></svg></button>
          <button id="btnCollapse" title="收起/展开"><svg class="window-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"></rect></svg></button>
          <button id="btnQuit" title="退出"><svg class="window-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8l8 8"></path><path d="M16 8l-8 8"></path></svg></button>
        </div>
      </header>
      <section class="panel-card quick-card">
        <h2>快捷操作</h2>
        <div class="quick-action-grid">
          <button id="btnOrganize" class="quick-action top"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="12" rx="2"></rect><path d="M8 21h8"></path><path d="M12 17v4"></path></svg>整理桌面</button>
          <button id="btnScreenshots" class="quick-action top"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="2"></rect><path d="m8 10 8 8"></path><path d="M8 18h8"></path></svg>整理截图</button>
          <button id="btnOpenVault" class="quick-action bottom"><span class="action-label"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"></path><path d="M6 7v12h12V7"></path><path d="M9 11h6"></path><path d="M9 15h6"></path></svg><span>整理箱</span></span></button>
          <button id="btnOpenTrash" class="quick-action bottom trash"><span class="action-label"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16"></path><path d="M7 8l1 12h8l1-12"></path><path d="M10 12v4"></path><path d="M14 12v4"></path><path d="M9 8l1-3h4l1 3"></path></svg><span>回收站</span></span></button>
          <button id="btnUndo" class="quick-action bottom undo"><span class="action-label"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9H4V4"></path><path d="M4 9a8 8 0 1 1 2.34 5.66"></path></svg><span>撤销</span></span></button>
        </div>
      </section>
      <section class="panel-card settings-card">
        <h2>设置</h2>
        <div class="setting-row size-row">
          <span class="setting-label">文件怪大小</span>
          <div class="range-row">
            <input id="petSize" type="range" min="160" max="360" step="10" value="220" />
            <span id="petSizeValue">220px</span>
          </div>
        </div>
        <div class="setting-row path-row">
          <span class="setting-label">整理箱路径</span>
          <div class="path-control">
            <input id="vaultPath" type="text" />
            <button id="btnBrowseVault" type="button">浏览</button>
          </div>
        </div>
        <div class="setting-row path-row">
          <span class="setting-label">Agnes API Key</span>
          <input id="agnesApiKey" type="password" placeholder="留空保持当前 Key" />
        </div>
        <div class="setting-row path-row">
          <span class="setting-label">AI 模型</span>
          <input id="agnesModel" type="text" />
        </div>
        <div class="switches">
          <label class="setting-row switch"><span class="setting-label">安全模式</span><input id="safeMode" type="checkbox" /><span class="switch-ui"></span></label>
          <label class="setting-row switch"><span class="setting-label">移动文件夹</span><input id="moveFolders" type="checkbox" checked /><span class="switch-ui"></span></label>
          <label class="setting-row switch"><span class="setting-label">日期前缀</span><input id="addDatePrefix" type="checkbox" /><span class="switch-ui"></span></label>
          <label class="setting-row switch"><span class="setting-label">开机自启</span><input id="launchAtLogin" type="checkbox" /><span class="switch-ui"></span></label>
          <label class="setting-row switch"><span class="setting-label">总是置顶</span><input id="alwaysOnTop" type="checkbox" /><span class="switch-ui"></span></label>
        </div>
      </section>
    </aside>
    <section id="aiDialog" class="ai-dialog" aria-label="AI 对话框" hidden>
      <header class="ai-dialog-header">
        <h2>AI 指令</h2>
        <button id="btnCloseAiDialog" type="button" title="关闭"><svg class="window-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8l8 8"></path><path d="M16 8l-8 8"></path></svg></button>
      </header>
      <div id="aiChatLog" class="ai-chat-log" aria-live="polite"></div>
      <div class="ai-command-card">
        <textarea id="aiCommand" rows="3" placeholder="输入：把今天截图整理一下 / 以后 .fig 放设计文件 / 这些文件能不能删"></textarea>
      </div>
    </section>
  </main>
  <script src="./action-state.js"></script>
  <script src="./operation-result.js"></script>
  <script src="./input-policy.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
